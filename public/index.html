<!doctype html>
<html lang="en">
  <head>
    <title>Engine Hours Editor</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A web application for editing engine hours data."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self'; connect-src 'self'; script-src 'self';"
    />
    <link rel="icon" type="image/png" href="icons/icon-72x72.png" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="app.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="header">
        <img
          src="icons/icon-72x72.png"
          alt="Engine Hours Icon"
          class="header-icon"
        />
        <h1>Engine Hours Editor</h1>
      </div>
      <div class="content-area">
        <div
          id="error-container"
          aria-live="assertive"
          aria-atomic="false"
        ></div>
        <div id="json-container"></div>
        <div class="action-buttons">
          <button
            id="reload-button"
            class="btn-modern btn-primary-modern"
            aria-label="Reload Data"
          >
            <i class="fas fa-sync-alt"></i>
            Reload Data
          </button>
          <button
            id="save-button"
            class="btn-modern btn-success-modern"
            style="display: none"
            aria-label="Save Changes"
          >
            <i class="fas fa-save"></i>
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
